 name: C/C++ CI

 on:
   push:
     branches: [ "main" ]
   pull_request:
     branches: [ "main" ]

 jobs:
   build:

     runs-on: windows-2022

     steps:
     - uses: actions/checkout@v4
     - name: checkout imgui-node-editor
       run: git submodule update --init --recursive mindseye/external/imgui-node-editor
     - name: build
       run: ./build.bat
       shell: cmd
